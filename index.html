<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>草台解码器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: #ffffff;
      --line: #d9dee8;
      --line-strong: #c8d2e1;
      --text: #243041;
      --muted: #667085;
      --subtle: #98a2b3;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --success: #0f9d58;
      --warn: #d97706;
      --danger: #dc2626;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.10), transparent 24%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    ::selection {
      background: rgba(37, 99, 235, 0.16);
    }

    .shell {
      max-width: 760px;
      margin: 0 auto;
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .topbar {
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(201, 210, 223, 0.75);
    }

    .footer {
      padding-top: 14px;
      border-top: 1px solid rgba(201, 210, 223, 0.75);
      justify-content: center;
      color: var(--subtle);
    }

    .brand {
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    .status {
      color: var(--success);
      font-weight: 600;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(201, 210, 223, 0.78);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .composer {
      padding: 24px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.16);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .textarea-wrap {
      position: relative;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--text);
      padding: 18px 18px 18px 18px;
      font: inherit;
      font-size: 15px;
      line-height: 1.75;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    textarea::placeholder {
      color: #9aa5b1;
    }

    textarea:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
      transform: translateY(-1px);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .hint {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.75;
      color: var(--muted);
    }

    .result {
      padding: 22px 24px 24px;
      display: grid;
      gap: 12px;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(201, 210, 223, 0.78);
    }

    .result-title {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .result-grid {
      display: grid;
      gap: 12px;
      margin-top: 4px;
    }

    .result-item {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(201, 210, 223, 0.8);
      border-radius: 16px;
      padding: 14px 16px;
    }

    .result-key {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .result-value {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
    }

    .meter {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(201, 210, 223, 0.8);
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,247,251,0.98));
    }

    .meter-left {
      display: grid;
      gap: 4px;
    }

    .meter-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .meter-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .meter-number {
      font-size: 38px;
      line-height: 1;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .bar {
      margin-top: 12px;
      height: 10px;
      border-radius: 999px;
      background: #e8edf5;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 64%;
      border-radius: inherit;
      background: linear-gradient(90deg, #60a5fa 0%, #2563eb 52%, #7c3aed 100%);
      transition: width 0.3s ease;
    }

    .empty {
      padding: 20px 16px;
      border-radius: 16px;
      border: 1px dashed rgba(151, 162, 179, 0.5);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      line-height: 1.75;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      color: var(--subtle);
      font-style: italic;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .shell {
        min-height: calc(100vh - 24px);
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .composer,
      .result {
        padding: 18px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .meter {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">草台解码器</div>
      <div class="status">● READY</div>
    </header>

    <section class="card composer">
      <div class="label-row">
        <div class="label">贴入你的对话 / 职场话术 / 聊天记录</div>
        <div id="status" class="badge">待解码</div>
      </div>

      <div class="textarea-wrap">
        <textarea
          id="input"
          placeholder="把你自己的对话粘贴到这里。比如领导、同事、客户说的话，或者一段聊天截图转文字。"
        ></textarea>
      </div>

      <div class="actions">
        <button id="decodeBtn" class="btn primary">解码</button>
        <button id="resetBtn" class="btn">清空</button>
        <button id="copyBtn" class="btn">复制结果</button>
      </div>

      <div class="hint">
        直接贴你的真实内容就行，不需要看示例。按 <strong>Enter</strong> 解码，<strong>Esc</strong> 清空，双击结果卡可以复制。
      </div>
    </section>

    <section class="card result">
      <div class="result-head">
        <div class="result-title">输出</div>
        <div id="riskBadge" class="badge">等待输入</div>
      </div>

      <div id="emptyState" class="empty">
        这里会显示解码结果。把你自己的对话贴进去，页面会直接给你看：
        <br />表面意思、潜台词、建议回复、风险等级。
      </div>

      <div id="outputPanel" class="hidden">
        <div class="result-grid">
          <div class="result-item">
            <div class="result-key">表面意思</div>
            <div id="surfaceText" class="result-value"></div>
          </div>

          <div class="result-item">
            <div class="result-key">潜台词</div>
            <div id="subtext" class="result-value"></div>
          </div>

          <div class="result-item">
            <div class="result-key">建议回复</div>
            <div id="replyText" class="result-value"></div>
          </div>

          <div class="meter">
            <div class="meter-left">
              <div class="result-key" style="margin:0;">风险等级</div>
              <div id="riskText" class="meter-label">-</div>
              <div id="airState" class="meter-sub">平静</div>
            </div>
            <div style="text-align:right;">
              <div class="result-key" style="margin:0 0 6px;">空气指数</div>
              <div id="airIndex" class="meter-number">67</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bar" aria-hidden="true">
        <div id="airBar" class="fill"></div>
      </div>
    </section>

    <footer class="footer">© 2026 都是空气，但不完全是废话</footer>
  </main>

  <script>
    const input = document.getElementById('input');
    const decodeBtn = document.getElementById('decodeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const copyBtn = document.getElementById('copyBtn');
    const statusEl = document.getElementById('status');
    const riskBadge = document.getElementById('riskBadge');
    const emptyState = document.getElementById('emptyState');
    const outputPanel = document.getElementById('outputPanel');
    const surfaceText = document.getElementById('surfaceText');
    const subtext = document.getElementById('subtext');
    const replyText = document.getElementById('replyText');
    const riskText = document.getElementById('riskText');
    const airState = document.getElementById('airState');
    const airIndex = document.getElementById('airIndex');
    const airBar = document.getElementById('airBar');

    const defaultEmptyHtml = `这里会显示解码结果。把你自己的对话贴进去，页面会直接给你看：
        <br />表面意思、潜台词、建议回复、风险等级。`;

    let currentResult = null;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function setStatus(text, tone = 'ready') {
      statusEl.textContent = text;
      statusEl.style.borderColor = 'rgba(201, 210, 223, 0.9)';
      statusEl.style.background = 'var(--accent-soft)';
      if (tone === 'loading') {
        statusEl.style.color = 'var(--warn)';
      } else if (tone === 'danger') {
        statusEl.style.color = 'var(--danger)';
      } else {
        statusEl.style.color = 'var(--accent)';
      }
    }

    function riskFromScore(score) {
      if (score < 30) return '低';
      if (score < 55) return '中';
      if (score < 75) return '中高';
      return '高';
    }

    function stateFromScore(score) {
      if (score < 30) return '平静';
      if (score < 55) return '有点意思';
      if (score < 75) return '暗流涌动';
      return '谁碰谁死';
    }

    function scoreFromRisk(risk) {
      switch (risk) {
        case '低':
          return 24;
        case '中':
          return 49;
        case '中高':
          return 68;
        case '高':
          return 87;
        default:
          return 49;
      }
    }

    function normalizeText(value, fallback) {
      const text = String(value ?? '').trim();
      return text || String(fallback ?? '').trim();
    }

    function renderEmpty() {
      currentResult = null;
      emptyState.classList.remove('hidden');
      emptyState.innerHTML = defaultEmptyHtml;
      outputPanel.classList.add('hidden');
      riskBadge.textContent = '等待输入';
      riskText.textContent = '-';
      airState.textContent = '平静';
      airIndex.textContent = '67';
      airBar.style.width = '67%';
      setStatus('待解码', 'ready');
    }

    function renderLoading() {
      currentResult = null;
      emptyState.classList.add('hidden');
      outputPanel.classList.remove('hidden');
      surfaceText.innerHTML = "<span class='loading'>解析中...</span>";
      subtext.innerHTML = "<span class='loading'>读取潜台词...</span>";
      replyText.innerHTML = "<span class='loading'>生成回复...</span>";
      riskText.textContent = '...';
      airState.textContent = '读取中';
      airIndex.textContent = '...';
      riskBadge.textContent = '扫描中';
      airBar.style.width = '12%';
      setStatus('解码中', 'loading');
    }

    function renderError(message) {
      currentResult = null;
      outputPanel.classList.add('hidden');
      emptyState.classList.remove('hidden');
      emptyState.innerHTML = `⚠️ <strong>解码失败。</strong><br />${escapeHtml(message)}`;
      riskBadge.textContent = '失败';
      riskText.textContent = '-';
      airState.textContent = '未完成';
      airIndex.textContent = '--';
      airBar.style.width = '0%';
      setStatus('失败', 'danger');
    }

    function renderResult(data) {
      const surface = normalizeText(data.surface || data.truth || data.raw, '表面意思待生成');
      const sub = normalizeText(data.subtext || data.penetrating || data.defensive || data.raw, '潜台词待生成');
      const reply = normalizeText(data.reply || data.zen || data.rebound || data.defensive, '建议回复待生成');
      const rawRisk = normalizeText(data.risk, '');
      const parsedScore = Number(data.airIndex);
      const score = clamp(
        Number.isFinite(parsedScore) ? Math.round(parsedScore) : scoreFromRisk(rawRisk || '中'),
        0,
        100
      );
      const risk = ['低', '中', '中高', '高'].includes(rawRisk) ? rawRisk : riskFromScore(score);
      const state = normalizeText(data.airState, stateFromScore(score));

      currentResult = { surface, sub, reply, risk, score, state };

      emptyState.classList.add('hidden');
      outputPanel.classList.remove('hidden');
      surfaceText.textContent = surface;
      subtext.textContent = sub;
      replyText.textContent = reply;
      riskText.textContent = risk;
      airState.textContent = state;
      airIndex.textContent = String(score);
      riskBadge.textContent = risk;
      airBar.style.width = `${score}%`;
      setStatus('已解码', risk === '高' ? 'danger' : 'ready');
    }

    async function decodeWithApi(text) {
      const response = await fetch('/api/decode', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ text })
      });

      let payload = {};
      try {
        payload = await response.json();
      } catch {
        payload = {};
      }

      if (!response.ok) {
        throw new Error(payload.error || payload.details || `请求失败：${response.status}`);
      }

      return payload;
    }

    function payloadText() {
      if (!currentResult) return '';
      return [
        `表面意思：${currentResult.surface}`,
        `潜台词：${currentResult.sub}`,
        `建议回复：${currentResult.reply}`,
        `风险等级：${currentResult.risk}`
      ].join('\n');
    }

    async function handleDecode() {
      const text = input.value.trim();
      if (!text) {
        renderEmpty();
        input.focus();
        return;
      }

      renderLoading();

      try {
        const data = await decodeWithApi(text);
        renderResult(data);
      } catch (error) {
        renderError(error?.message || '未知错误');
      }
    }

    decodeBtn.addEventListener('click', handleDecode);

    resetBtn.addEventListener('click', () => {
      input.value = '';
      renderEmpty();
      input.focus();
    });

    copyBtn.addEventListener('click', async () => {
      if (!currentResult) return;
      try {
        await navigator.clipboard.writeText(payloadText());
        setStatus('已复制', 'ready');
      } catch {
        setStatus('复制失败', 'danger');
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleDecode();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        input.value = '';
        renderEmpty();
      }
    });

    outputPanel.addEventListener('dblclick', async () => {
      if (!currentResult) return;

      try {
        await navigator.clipboard.writeText(payloadText());
        setStatus('已复制', 'ready');
        alert('结果已复制。');
      } catch {
        setStatus('复制失败', 'danger');
      }
    });

    renderEmpty();
    input.focus();
  </script>
</body>
</html>
